<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Aventurer</title>
</head>
<body>
    <h1>GamerAventurer</h1>

    <div class="form">
       <div class="input-container">
        <label for="input-nome">Nome</label>
        <input id="input-nome" type="text" placeholder="digite seu nome:"> 
       </div>
       <div class="input-container">
        <label for="inp-data de nascimento">Data de nascimento</label>
        <input id="data de nascimento" type="date" placeholder="digite sua data: ">
        </div>
       <div class="input-container">
        <label for="inp-cpf">CPF</label>
        <input id="inp-cpf" type="number">
        </div>
       <div class="input-container">
        <label for="inp-nome de usuário">Nome de usuário</label>
        <input id="inp-nome de usuário" type="text">
        </div>
       <div class="input-container">
        <label for="inp-senha">Senha</label>
        <input id="inp-senha" type="password">
        </div>
 
    </div> 
      
    

</body>
