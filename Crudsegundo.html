<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Crudsegundo.css">
    <title>Gamerperiféricos</title>
</head>
<body>
    <h1 class="title-name">Adventurous device</h1>

    <div class="form">
       <div class="input-container">
        <label for="inp-ssd-hd">SSD/HD:</label>
        <input id="inp-ssd" type="text"> 
       </div>
       <div class="input-container">
        <label for="inp-modelomonitor">Monitor:</label>
        <input id="inp-modelomonitor" type="text">
        </div>
       <div class="input-container">
        <label for="inp-modelomemoriaram">Memória Ram:</label>
        <input id="inp-modelomemoriaram" type="text"> 
        </div>
       <div class="input-container">
        <label for="inp-modeloprocessador">Processador:</label>
        <input id="inp-modeloprocessador" type="text">
        </div>
       <div class="input-container">
        <label for="inp-modelomouse">Mouse:</label>
        <input id="inp-modelomouse" type="text">
        </div>
       <div class="input-container">
        <label for="inp-modeloteclado">Teclado:</label>
        <input id="inp-modeloteclado" type="text">
        </div>
       <div class="input-container">
        <label for="inp-modeloplacamae">Placa-Mãe:</label>
        <input id="inp-modeloplacamae" type="text">
        </div>
        <button class="bt-action" onclick="cadastrarPeriféricos()">Cadastrar Dispositivos</button>
        <button class="bt-excluirdigitações" onclick="limparformPeriféricos()">limparDispositivos</button>
    </div> 
      
    <script src="Crudsegundo.js"></script>
</body>
</html>
